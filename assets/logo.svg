<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Postero">
  <defs>
    <linearGradient id="pstr-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#3B4CCA"/>
    </linearGradient>
  </defs>

  <!-- rounded card -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#pstr-card)"/>

  <!-- envelope body -->
  <rect x="28" y="40" width="72" height="50" rx="9"
        fill="none" stroke="#FFFFFF" stroke-width="5"/>

  <!-- envelope flap drawn as a shell prompt ">" — mail meets terminal -->
  <path d="M40 52 L60 65 L40 78"
        fill="none" stroke="#FFFFFF" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- blinking-cursor block: the "keyboard-driven" mark -->
  <rect x="70" y="60" width="14" height="10" rx="2" fill="#FFFFFF"/>
</svg>
